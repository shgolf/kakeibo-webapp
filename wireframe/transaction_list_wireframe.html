<style>
  .wf-screen { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); overflow: hidden; max-width: 360px; margin: 0 auto; }
  .wf-nav { background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .wf-nav-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .wf-nav-links { display: flex; gap: 16px; }
  .wf-nav-link { font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; }
  .wf-nav-link.active { color: var(--color-text-primary); font-weight: 500; }
  .wf-body { background: var(--color-background-primary); padding: 16px; }
  .wf-section-label { font-size: 11px; color: var(--color-text-tertiary); margin: 0 0 8px; letter-spacing: 0.04em; }
  .wf-filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .wf-select { flex: 1; font-size: 12px; padding: 6px 8px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
  .wf-total-bar { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 0.5px solid var(--color-border-tertiary); }
  .wf-total-label { font-size: 12px; color: var(--color-text-secondary); }
  .wf-total-value { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
  .wf-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .wf-table thead tr { border-bottom: 0.5px solid var(--color-border-secondary); }
  .wf-table th { color: var(--color-text-tertiary); font-weight: 400; padding: 6px 4px; text-align: left; }
  .wf-table th:last-child { text-align: right; }
  .wf-table td { padding: 10px 4px; color: var(--color-text-primary); vertical-align: middle; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .wf-table td:last-child { text-align: right; font-weight: 500; }
  .wf-table tr:last-child td { border-bottom: none; }
  .wf-table tbody tr { cursor: pointer; }
  .wf-table tbody tr:hover td { background: var(--color-background-secondary); }
  .wf-badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 99px; background: var(--color-background-secondary); color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); }
  .wf-meta { font-size: 10px; color: var(--color-text-tertiary); margin-top: 2px; }
  .wf-btn-primary { width: 100%; padding: 12px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
</style>

    <button class="wf-btn-primary" onclick="sendPrompt('入力画面のワイヤーフレームを作って')">

  </div>
</div>
