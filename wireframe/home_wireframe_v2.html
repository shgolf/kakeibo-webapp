<style>
  .wf-screen { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); overflow: hidden; max-width: 360px; margin: 0 auto; }
  .wf-nav { background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .wf-nav-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .wf-nav-links { display: flex; gap: 16px; }
  .wf-nav-link { font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; }
  .wf-nav-link.active { color: var(--color-text-primary); font-weight: 500; }
  .wf-body { background: var(--color-background-primary); padding: 16px; }
  .wf-section-label { font-size: 11px; color: var(--color-text-tertiary); margin: 0 0 8px; letter-spacing: 0.04em; }
  .wf-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 14px 16px; margin-bottom: 12px; border: 0.5px solid var(--color-border-tertiary); }
  .wf-summary-amount { font-size: 28px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 2px; }
  .wf-summary-sub { font-size: 12px; color: var(--color-text-secondary); margin: 0; }
  .wf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .wf-mini-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); }
  .wf-mini-label { font-size: 11px; color: var(--color-text-secondary); margin: 0 0 4px; }
  .wf-mini-value { font-size: 16px; font-weight: 500; color: var(--color-text-primary); margin: 0; }
  .wf-btn-primary { width: 100%; padding: 12px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .wf-btn-secondary { width: 100%; padding: 10px; background: transparent; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .wf-divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 10px 0; }
  .wf-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .wf-row-label { font-size: 13px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; }
  .wf-row-value { font-size: 13px; color: var(--color-text-primary); font-weight: 500; }
  .wf-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .wf-txn { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .wf-txn:last-child { border-bottom: none; }
  .wf-txn-left { display: flex; flex-direction: column; gap: 2px; }
  .wf-txn-title { font-size: 13px; color: var(--color-text-primary); font-weight: 500; }
  .wf-txn-meta { font-size: 11px; color: var(--color-text-tertiary); }
  .wf-txn-amount { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .wf-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .wf-section-more { font-size: 11px; color: var(--color-text-secondary); cursor: pointer; }
</style>

<h2 class="sr-only">ホーム画面のワイヤーフレーム（直近の取引追加版）</h2>

<div class="wf-screen">
  <div class="wf-nav">
    <span class="wf-nav-title"><i class="ti ti-wallet" aria-hidden="true"></i> 家計簿</span>
    <div class="wf-nav-links">
      <span class="wf-nav-link active"><i class="ti ti-home" aria-hidden="true"></i> ホーム</span>
      <span class="wf-nav-link"><i class="ti ti-list" aria-hidden="true"></i> 一覧</span>
    </div>
  </div>

  <div class="wf-body">
    <p class="wf-section-label">2026年5月 サマリー</p>
    <div class="wf-card">
      <p class="wf-summary-sub">当月合計支出</p>
      <p class="wf-summary-amount">¥84,500</p>
      <hr class="wf-divider">
      <div class="wf-row">
        <span class="wf-row-label"><span class="wf-dot" style="background:var(--color-text-secondary)"></span>現金</span>
        <span class="wf-row-value">¥32,000</span>
      </div>
      <div class="wf-row">
        <span class="wf-row-label"><span class="wf-dot" style="background:var(--color-text-tertiary)"></span>クレジット</span>
        <span class="wf-row-value">¥52,500</span>
      </div>
    </div>

    <p class="wf-section-label">カテゴリ別</p>
    <div class="wf-grid">
      <div class="wf-mini-card">
        <p class="wf-mini-label"><i class="ti ti-tools-kitchen-2" aria-hidden="true"></i> 食費</p>
        <p class="wf-mini-value">¥28,000</p>
      </div>
      <div class="wf-mini-card">
        <p class="wf-mini-label"><i class="ti ti-train" aria-hidden="true"></i> 交通費</p>
        <p class="wf-mini-value">¥12,000</p>
      </div>
      <div class="wf-mini-card">
        <p class="wf-mini-label"><i class="ti ti-shirt" aria-hidden="true"></i> 衣類</p>
        <p class="wf-mini-value">¥18,500</p>
      </div>
      <div class="wf-mini-card">
        <p class="wf-mini-label"><i class="ti ti-dots" aria-hidden="true"></i> その他</p>
        <p class="wf-mini-value">¥26,000</p>
      </div>
    </div>

    <div class="wf-section-header">
      <p class="wf-section-label" style="margin:0">直近の取引</p>
      <span class="wf-section-more" onclick="sendPrompt('取引一覧画面のワイヤーフレームを作って')">すべて見る →</span>
    </div>
    <div class="wf-card" style="padding: 4px 16px;">
      <div class="wf-txn">
        <div class="wf-txn-left">
          <span class="wf-txn-title">スーパー</span>
          <span class="wf-txn-meta">5月10日・食費・現金</span>
        </div>
        <span class="wf-txn-amount">¥3,200</span>
      </div>
      <div class="wf-txn">
        <div class="wf-txn-left">
          <span class="wf-txn-title">電車定期</span>
          <span class="wf-txn-meta">5月9日・交通費・クレジット</span>
        </div>
        <span class="wf-txn-amount">¥12,000</span>
      </div>
      <div class="wf-txn">
        <div class="wf-txn-left">
          <span class="wf-txn-title">ランチ</span>
          <span class="wf-txn-meta">5月8日・食費・現金</span>
        </div>
        <span class="wf-txn-amount">¥980</span>
      </div>
    </div>

    <button class="wf-btn-primary" onclick="sendPrompt('入力画面のワイヤーフレームを作って')">
      <i class="ti ti-plus" aria-hidden="true"></i> 新規登録
    </button>
    <button class="wf-btn-secondary" onclick="sendPrompt('取引一覧画面のワイヤーフレームを作って')">
      <i class="ti ti-list" aria-hidden="true"></i> 取引一覧を見る
    </button>
  </div>
</div>
